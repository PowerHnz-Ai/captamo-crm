# Ultra API CRM — proxy reverso para Next.js (porta 3000)
# Instalar em: /etc/nginx/sites-available/ultra-api
# ln -sf /etc/nginx/sites-available/ultra-api /etc/nginx/sites-enabled/
# Remover ou desativar site estático meu-checklist se app.misterodonto.com.br for só o CRM.
# nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name app.misterodonto.com.br;

    client_max_body_size 100M;

    # SSE (inbox em tempo real): sem buffering, timeout longo, sem access log
    # (token vai na query string). Em produção, replicar este bloco também no
    # server block 443 gerenciado pelo certbot.
    location /api/realtime/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Após certbot:
# certbot --nginx -d app.misterodonto.com.br
