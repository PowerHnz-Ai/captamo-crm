<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/checklist/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra — Entrar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
</head>
<body class="auth-page bg-app-bg text-app-text font-sans antialiased">
  <div class="mesh-bg" aria-hidden="true"></div>
  <div class="auth-container relative z-10 w-full max-w-md">
    <div class="auth-card glass-surface rounded-2xl p-6 md:p-8">
      <div class="mb-2 text-center">
        <span class="ultra-wordmark">Ultra</span>
      </div>
      <p class="auth-subtitle mt-1 text-center text-sm text-app-muted">Checklist de tarefas da equipe</p>

      <div id="authTabs" class="auth-tabs mt-6 mb-6 grid grid-cols-2 gap-2">
        <button class="auth-tab active rounded-lg border border-app-border bg-app-secondary px-3 py-2.5 text-sm font-medium text-app-subtle transition-colors duration-200 hover:text-app-text" data-tab="login">Entrar</button>
        <button class="auth-tab rounded-lg border border-app-border bg-app-secondary px-3 py-2.5 text-sm font-medium text-app-subtle transition-colors duration-200 hover:text-app-text" data-tab="register">Cadastrar</button>
      </div>

      <!-- Login -->
      <form id="loginForm" class="auth-form space-y-4">
        <div class="form-group space-y-1.5">
          <label for="loginEmail" class="text-sm font-medium text-app-subtle">E-mail</label>
          <input class="h-11 w-full rounded-lg border border-app-border bg-app-secondary px-3 text-sm text-app-text outline-none transition-colors placeholder:text-app-muted focus:border-app-accent focus:ring-2 focus:ring-app-accent/30" type="email" id="loginEmail" placeholder="seu@email.com" required>
        </div>
        <div class="form-group space-y-1.5">
          <label for="loginPassword" class="text-sm font-medium text-app-subtle">Senha</label>
          <input class="h-11 w-full rounded-lg border border-app-border bg-app-secondary px-3 text-sm text-app-text outline-none transition-colors placeholder:text-app-muted focus:border-app-accent focus:ring-2 focus:ring-app-accent/30" type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <p id="authError" class="auth-error min-h-5 text-sm text-red-400"></p>
        <button type="submit" class="btn-primary btn-full mt-2 inline-flex h-11 w-full items-center justify-center rounded-lg bg-app-accent px-4 text-sm font-semibold text-white transition-colors hover:bg-app-accentHover">Entrar</button>
      </form>

      <!-- Cadastro -->
      <form id="registerForm" class="auth-form space-y-4" style="display: none;">
        <div class="form-group space-y-1.5">
          <label for="registerName" class="text-sm font-medium text-app-subtle">Nome</label>
          <input class="h-11 w-full rounded-lg border border-app-border bg-app-secondary px-3 text-sm text-app-text outline-none transition-colors placeholder:text-app-muted focus:border-app-accent focus:ring-2 focus:ring-app-accent/30" type="text" id="registerName" placeholder="Seu nome" required>
        </div>
        <div class="form-group space-y-1.5">
          <label for="registerEmail" class="text-sm font-medium text-app-subtle">E-mail</label>
          <input class="h-11 w-full rounded-lg border border-app-border bg-app-secondary px-3 text-sm text-app-text outline-none transition-colors placeholder:text-app-muted focus:border-app-accent focus:ring-2 focus:ring-app-accent/30" type="email" id="registerEmail" placeholder="seu@email.com" required>
        </div>
        <div class="form-group space-y-1.5">
          <label for="registerPassword" class="text-sm font-medium text-app-subtle">Senha (mín. 6 caracteres)</label>
          <input class="h-11 w-full rounded-lg border border-app-border bg-app-secondary px-3 text-sm text-app-text outline-none transition-colors placeholder:text-app-muted focus:border-app-accent focus:ring-2 focus:ring-app-accent/30" type="password" id="registerPassword" placeholder="••••••••" minlength="6" required>
        </div>
        <div class="form-group space-y-2">
          <label class="text-sm font-medium text-app-subtle">Tipo de conta</label>
          <div class="auth-radio-group grid gap-2">
            <label class="auth-radio flex items-center gap-2 rounded-lg border border-app-border bg-app-secondary px-3 py-2 text-sm">
              <input type="radio" name="registerAccountType" value="companyAdmin" checked>
              <span>Criar empresa (administrador)</span>
            </label>
            <label class="auth-radio flex items-center gap-2 rounded-lg border border-app-border bg-app-secondary px-3 py-2 text-sm">
              <input type="radio" name="registerAccountType" value="companyMember">
              <span>Entrar em empresa existente</span>
            </label>
          </div>
        </div>
        <div class="form-group space-y-1.5" id="companyNameGroup">
          <label for="registerCompanyName" class="text-sm font-medium text-app-subtle">Nome da empresa</label>
          <input class="h-11 w-full rounded-lg border border-app-border bg-app-secondary px-3 text-sm text-app-text outline-none transition-colors placeholder:text-app-muted focus:border-app-accent focus:ring-2 focus:ring-app-accent/30" type="text" id="registerCompanyName" placeholder="Ex: Padaria Central LTDA">
        </div>
        <div class="form-group space-y-1.5" id="companyCodeGroup" style="display: none;">
          <label for="registerCompanyCode" class="text-sm font-medium text-app-subtle">Código da empresa</label>
          <input class="h-11 w-full rounded-lg border border-app-border bg-app-secondary px-3 text-sm text-app-text outline-none transition-colors placeholder:text-app-muted focus:border-app-accent focus:ring-2 focus:ring-app-accent/30" type="text" id="registerCompanyCode" placeholder="Cole aqui o código enviado pelo administrador">
        </div>
        <p id="registerError" class="auth-error min-h-5 text-sm text-red-400"></p>
        <button type="submit" class="btn-primary btn-full mt-2 inline-flex h-11 w-full items-center justify-center rounded-lg bg-app-accent px-4 text-sm font-semibold text-white transition-colors hover:bg-app-accentHover">Criar conta</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script>
    if (firebaseConfig.projectId && firebaseConfig.projectId !== 'SEU_PROJETO_ID') {
      firebase.initializeApp(firebaseConfig);
    }
  </script>
  <script src="auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
