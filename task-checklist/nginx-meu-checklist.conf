# Configuração Nginx para Meu Checklist
# Copie para: /etc/nginx/sites-available/meu-checklist
# Depois: ln -sf /etc/nginx/sites-available/meu-checklist /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#
# Substitua SEU_DOMINIO_OU_IP pelo seu domínio (ex: checklist.seudominio.com) ou pelo IP da VPS

server {
    listen 80;
    server_name SEU_DOMINIO_OU_IP;
    root /var/www/meu-checklist;
    index index.html;

    location = /auth {
        try_files /auth.html =404;
    }

    location = /auth/ {
        try_files /auth.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS mudam sem nome versionado, então precisam revalidar para evitar layout antigo.
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Cache para assets estáticos versionados ou raramente alterados
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker não deve ser cacheado agressivamente
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Segurança básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
